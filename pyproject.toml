[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samap-extension"
dynamic = ["version"]
authors = [
    { name = "Francisco Pereira Lobo", email = "pereiralobof2@nih.gov" },
]
description = "Extensions for SAMap cross-species analysis and visualization."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

dependencies = [
    "anndata",
    "matplotlib",
    "numpy",
    "pandas",
    "scanpy",
    "scipy",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.dynamic]
version = { attr = "samap_extension.__version__" }

[project.urls]
Homepage = "https://github.com/franciscolobo/samap-extension"
Issues = "https://github.com/franciscolobo/samap-extension/issues"
