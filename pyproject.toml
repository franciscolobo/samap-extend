[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samap-extension"
version = "0.1.0"
authors = [
  { name="CDBL", email="pereiralobof2@nih.gov" },
]
description = "SAMap cross-species analysis and plotting tools for CDBL."
readme = "README.md"
# Target Python 3.9 explicitly — SAMap's stack requires it.
requires-python = ">=3.9,<3.10"
license = { file="LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# No dependencies declared — this package must be installed with
# `pip install --no-deps` into the SAMap conda environment.
# All required packages (numpy, pandas, matplotlib, scanpy, samap,
# holoviews, bokeh, labcore) are managed by the conda environment.
# See environment_samap.yml and the Installation section of README.md.
dependencies = []

[project.urls]
Homepage = "https://github.com/franciscolobo/samap-extension"
Issues = "https://github.com/franciscolobo/samap-extension/issues"
